# Stack Quantum Trade AI — PRODUCTION (VPS + HTTPS).
#
# Lancement :  docker compose --env-file .env -f infra/docker-compose.prod.yml up -d --build
# Voir le guide complet : globale/06_PLAN_DEPLOIEMENT.md
#
# Différences ASSUMÉES avec `docker-compose.yml` (le fichier de développement) :
#
# 1. AUCUN port applicatif n'est publié sur l'hôte. Seul Caddy écoute (80/443) et sert de porte
#    d'entrée unique. Publier 3000 et 8090 sur une machine à IP publique reviendrait à exposer
#    l'API sans TLS à côté de la version chiffrée — la version non chiffrée gagnerait à chaque fois
#    qu'un lien traîne quelque part.
# 2. HTTPS automatique via Caddy (certificat Let's Encrypt renouvelé tout seul). Sans TLS, le mot
#    de passe du compte et le jeton d'API transitent en clair : inacceptable dès que la machine
#    n'est plus sur le réseau local.
# 3. `redpanda` a DISPARU. Aucune ligne de code du backend ne s'y connecte (seule la variable
#    `kafka_bootstrap_servers` existe, sans consommateur) : le conteneur réservait ~1 Go de RAM pour
#    ne rien faire. Sur un VPS à 4 Go, c'est un quart de la machine.
# 4. `restart: unless-stopped` PARTOUT : après un redémarrage du VPS (mise à jour noyau, incident
#    hébergeur), la stack doit se relever seule. Un robot de trading qui attend une intervention
#    humaine pour repartir n'est pas un robot.
# 5. Le backend tourne en `ENVIRONMENT=prod` et n'accepte plus le CORS localhost.

name: quantum-trade-ai

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire en production}
      POSTGRES_DB: ${POSTGRES_DB:-quantum}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantum}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Sauvegarde quotidienne (pg_dump compressé, rétention 14 jours) dans un volume SÉPARÉ de la base :
  # une corruption de `pgdata` ne peut pas emporter ses propres sauvegardes. Restauration : docs/BACKUPS.md.
  db-backup:
    image: timescale/timescaledb:latest-pg16
    entrypoint: ["/bin/bash", "/backup.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-quantum}
      POSTGRES_DB: ${POSTGRES_DB:-quantum}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire en production}
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      - pgbackups:/backups
      - ./db/backup.sh:/backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    env_file:
      - path: ../.env
        required: false
    environment:
      USE_IN_MEMORY_DB: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quantum}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quantum}
      REDIS_URL: redis://redis:6379/0
      # Le navigateur n'appelle QUE le domaine public : c'est la seule origine autorisée.
      CORS_ORIGINS: https://${DOMAIN:?DOMAIN est obligatoire (ex. trade.mondomaine.com)}
      ENVIRONMENT: prod
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY est obligatoire en production (openssl rand -hex 32)}
      # Usage privé (2 personnes) : fermé par défaut. Ouvrir temporairement à "true" (variable
      # ALLOW_REGISTRATION dans .env) le temps de créer les 2 comptes, puis refermer et redémarrer.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    # Pas de `ports:` — Caddy joint le backend par le réseau interne, sur `backend:8000`.
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        # Next.js fige les NEXT_PUBLIC_* DANS LE BUNDLE au moment du build : changer de domaine
        # impose donc de reconstruire l'image, pas seulement de redémarrer le conteneur.
        # Les deux passent par Caddy (même domaine, chemin /api et /ws) — aucun port en clair.
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
        NEXT_PUBLIC_WS_URL: wss://${DOMAIN}/ws
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Porte d'entrée UNIQUE : termine le TLS, obtient et renouvelle le certificat tout seul, puis
  # route /api et /ws vers le backend et tout le reste vers le frontend.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data      # certificats — à conserver, sinon Let's Encrypt finit par limiter
      - caddyconfig:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  pgbackups:
  caddydata:
  caddyconfig:
