# CI (plan Phase 1.4) : build de l'image backend + suite pytest COMPLÈTE dans le conteneur,
# à CHAQUE push (toutes branches) et pull request. La suite tourne exactement comme en local :
#   docker run --rm -v backend:/src -w /src <image> python -m pytest tests/ -q
# (le code monté dans /src prime sur la copie figée de /app — même piège qu'en local, même parade).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (image + tests dans le conteneur)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image (cache GitHub Actions)
        uses: docker/build-push-action@v6
        with:
          context: backend
          tags: quantum-trade-ai-backend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tests (pytest, dans le conteneur — comme en prod)
        run: >
          docker run --rm
          -v "${{ github.workspace }}/backend:/src" -w /src
          quantum-trade-ai-backend:ci
          python -m pytest tests/ -q

  frontend:
    name: Frontend (image = build Next.js strict)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Le build de l'image EST le test : il échoue sur toute erreur TypeScript/Next.
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          tags: quantum-trade-ai-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
